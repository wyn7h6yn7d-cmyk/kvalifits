name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ordinary CI does not use production secrets.
# Playwright config provides non-production placeholders and live tests are skipped
# unless real E2E credentials + Supabase keys are configured.
# Sentry DSN / auth token are intentionally unset (SDK no-op, no source-map upload).
# Live RLS: npm run test:security (workflow rls-security.yml, manual).

env: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit / integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Selected E2E smoke
        run: npm run test:e2e
        env:
          CI: true
